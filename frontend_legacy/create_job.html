<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Evalora Interview Engine – Create a new recruitment job and upload knowledge resources." />
    <title>Evalora – Create Job</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
    <style>
        /* Premium glassmorphism background */
        body {
            background: linear-gradient(135deg, #0d0d0d, #1a1a2e);
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 2rem;
            width: 100%;
            max-width: 720px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .card h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .card p { margin-bottom: 1.5rem; color: #b0b0b0; }
        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        .input-group input, .input-group textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.12);
            color: #fff;
            font-size: 1rem;
        }
        .input-group input::placeholder, .input-group textarea::placeholder {
            color: #aaa;
        }
        .dropzone {
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .dropzone:hover { background: rgba(255,255,255,0.08); }
        .progress {
            margin-top: 1rem;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar { background: #3b82f6; width: 0%; height: 100%; transition: width 0.3s; }
        .btn-primary {
            background: #3b82f6;
            border: none;
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Create New Job</h1>
        <p>Define a recruitment job and upload the knowledge resources that the interview engine will use.</p>
        <div class="input-group">
            <label for="job-title">Job Title</label>
            <input type="text" id="job-title" placeholder="e.g. Senior Front‑End Engineer" />
        </div>
        <div class="input-group">
            <label for="job-description">Job Description</label>
            <textarea id="job-description" rows="3" placeholder="Brief description of the role, responsibilities, and requirements."></textarea>
        </div>
        <hr />
        <div class="input-group">
            <label>Knowledge Resources</label>
            <div class="dropzone" id="dropzone">
                Drag &amp; drop files here or click to select (PDF, DOCX, TXT…) <br />
                <small>Maximum 50 MB per file</small>
                <input type="file" id="file-input" multiple accept=".pdf,.docx,.txt,.md" style="display:none" />
            </div>
            <div class="progress" id="upload-progress" style="display:none;">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>
        <button class="btn-primary" id="create-btn">Create Job &amp; Upload</button>
    </div>
    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');
        const progressBar = document.getElementById('progress-bar');
        const uploadProgress = document.getElementById('upload-progress');
        const createBtn = document.getElementById('create-btn');

        dropzone.addEventListener('click', () => fileInput.click());
        dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.style.background = 'rgba(255,255,255,0.08)'; });
        dropzone.addEventListener('dragleave', e => { e.preventDefault(); dropzone.style.background = ''; });
        dropzone.addEventListener('drop', e => {
            e.preventDefault();
            dropzone.style.background = '';
            fileInput.files = e.dataTransfer.files;
        });

        async function createJob() {
            const title = document.getElementById('job-title').value.trim();
            const description = document.getElementById('job-description').value.trim();
            if (!title) { alert('Please provide a job title'); return; }
            // 1️⃣ Create job
            const jobResp = await fetch('/jobs/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description })
            });
            if (!jobResp.ok) { alert('Failed to create job'); return; }
            const jobData = await jobResp.json();
            const jobId = jobData.job_id;
            // 2️⃣ Upload files sequentially
            const files = fileInput.files;
            if (files.length === 0) { alert('Select at least one file'); return; }
            uploadProgress.style.display = 'block';
            for (let i = 0; i < files.length; i++) {
                const form = new FormData();
                form.append('file', files[i]);
                const uploadResp = await fetch(`/jobs/${jobId}/upload`, {
                    method: 'POST',
                    body: form
                });
                if (!uploadResp.ok) { alert('Upload failed'); return; }
                const percent = Math.round(((i + 1) / files.length) * 100);
                progressBar.style.width = percent + '%';
            }
            alert('Job created and resources uploaded!');
            // Optionally redirect to interview generation page
        }

        createBtn.addEventListener('click', createJob);
    </script>
</body>
</html>
